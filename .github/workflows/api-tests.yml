name: ShareIt API Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -q

      - name: Start Spring Boot Server
        run: |
          # Запускаем сервер в фоновом режиме
          mvn spring-boot:run -DskipTests -q &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          
          # Ждем пока сервер запустится
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null 2>&1; then
              echo "✅ Server is running!"
              break
            fi
            echo "Attempt $i/30: Server not ready yet..."
            sleep 2
          done
          
          if ! curl -s http://localhost:8080 > /dev/null 2>&1; then
            echo "❌ Server failed to start"
            exit 1
          fi

      - name: Install Newman
        run: npm install -g newman

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Postman Tests
        run: |
          # Проверяем существование файла коллекции
          if [ ! -f "./src/test/resources/sprint.json" ]; then
            echo "❌ Collection file not found at ./src/test/resources/sprint.json"
            echo "Available files in src/test/resources/:"
            find ./src/test/resources/ -name "*.json" -type f
            exit 1
          fi
          
          echo "✅ Found collection file: ./src/test/resources/sprint.json"
          
          # Проверяем шаблон если указан
          if [ -f "./tests/.github/workflows/dashboard-template.hbs" ]; then
            TEMPLATE_OPTION="--reporter-htmlextra-template ./tests/.github/workflows/dashboard-template.hbs"
            echo "Using custom template"
          else
            TEMPLATE_OPTION=""
            echo "Using default template"
          fi
          
          # Запускаем тесты
          newman run ./src/test/resources/sprint.json \
            --delay-request 50 \
            -r cli,htmlextra \
            --verbose \
            --color on \
            --reporter-htmlextra-darkTheme \
            --reporter-htmlextra-export reports/shareIt.html \
            --reporter-htmlextra-title "Отчет по тестам" \
            --reporter-htmlextra-logs true \
            $TEMPLATE_OPTION

      - name: Stop Spring Boot Server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            echo "Stopping server with PID: $SERVER_PID"
            kill $SERVER_PID 2>/dev/null || true
          fi
          pkill -f "spring-boot" 2>/dev/null || true

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-report
          path: reports/shareIt.html
          retention-days: 7

      - name: Show test results summary
        if: always()
        run: |
          echo "=== Test Results Summary ==="
          if [ -f "reports/shareIt.html" ]; then
            echo "✅ Test report generated: reports/shareIt.html"
            echo "Download link will be available in Artifacts section"
          else
            echo "⚠️ No test report generated"
          fi